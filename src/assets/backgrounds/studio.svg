<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- Wall Panels -->
  <rect x="100" y="80" width="300" height="450" rx="8" fill="#1e1e2f" stroke="#2d2d44" stroke-width="2"/>
  <rect x="440" y="80" width="400" height="450" rx="8" fill="#1a1a2b" stroke="#2d2d44" stroke-width="2"/>
  <rect x="880" y="80" width="300" height="450" rx="8" fill="#1e1e2f" stroke="#2d2d44" stroke-width="2"/>
  <!-- Studio Neon Strips -->
  <line x1="100" y1="80" x2="400" y2="80" stroke="#818cf8" stroke-width="4" filter="drop-shadow(0 0 8px #818cf8)"/>
  <line x1="440" y1="80" x2="840" y2="80" stroke="#22d3ee" stroke-width="4" filter="drop-shadow(0 0 8px #22d3ee)"/>
  <line x1="880" y1="80" x2="1180" y2="80" stroke="#818cf8" stroke-width="4" filter="drop-shadow(0 0 8px #818cf8)"/>
  <!-- Ambient Spotlight cones -->
  <polygon points="250,80 150,530 350,530" fill="url(#light)"/>
  <polygon points="1030,80 930,530 1130,530" fill="url(#light)"/>
  <!-- Floor line -->
  <line x1="0" y1="530" x2="1280" y2="530" stroke="#2d2d44" stroke-width="2"/>
  <rect x="0" y="530" width="1280" height="190" fill="#0d0d14"/>
  <!-- Soundproofing acoustic foam grid -->
  <g fill="#252538" opacity="0.6">
    <rect x="470" y="120" width="60" height="60" rx="4"/>
    <rect x="550" y="120" width="60" height="60" rx="4"/>
    <rect x="630" y="120" width="60" height="60" rx="4"/>
    <rect x="710" y="120" width="60" height="60" rx="4"/>
    <rect x="470" y="200" width="60" height="60" rx="4"/>
    <rect x="550" y="200" width="60" height="60" rx="4"/>
    <rect x="630" y="200" width="60" height="60" rx="4"/>
    <rect x="710" y="200" width="60" height="60" rx="4"/>
    <rect x="470" y="280" width="60" height="60" rx="4"/>
    <rect x="550" y="280" width="60" height="60" rx="4"/>
    <rect x="630" y="280" width="60" height="60" rx="4"/>
    <rect x="710" y="280" width="60" height="60" rx="4"/>
  </g>
</svg>
