<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="libWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="warmLamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#libWall)"/>
  
  <!-- Kitaplık Rafları Sol -->
  <g fill="#292524" stroke="#44403c" stroke-width="4">
    <rect x="60" y="40" width="340" height="640" rx="6"/>
    <!-- Raflar -->
    <line x1="60" y1="180" x2="400" y2="180"/>
    <line x1="60" y1="320" x2="400" y2="320"/>
    <line x1="60" y1="460" x2="400" y2="460"/>
    <line x1="60" y1="580" x2="400" y2="580"/>
  </g>

  <!-- Kitaplık Rafları Sağ -->
  <g fill="#292524" stroke="#44403c" stroke-width="4">
    <rect x="880" y="40" width="340" height="640" rx="6"/>
    <!-- Raflar -->
    <line x1="880" y1="180" x2="1220" y2="180"/>
    <line x1="880" y1="320" x2="1220" y2="320"/>
    <line x1="880" y1="460" x2="1220" y2="460"/>
    <line x1="880" y1="580" x2="1220" y2="580"/>
  </g>

  <!-- Sol Kitaplar -->
  <g stroke="#1c1917" stroke-width="2">
    <!-- Raf 1 -->
    <rect x="80" y="70" width="24" height="106" fill="#dc2626"/>
    <rect x="106" y="80" width="28" height="96" fill="#2563eb"/>
    <rect x="136" y="60" width="20" height="116" fill="#16a34a"/>
    <rect x="158" y="75" width="30" height="101" fill="#d97706"/>
    <rect x="190" y="65" width="22" height="111" fill="#9333ea"/>
    <rect x="214" y="85" width="28" height="91" fill="#0284c7"/>
    <rect x="244" y="70" width="34" height="106" fill="#b45309"/>
    
    <!-- Raf 2 -->
    <rect x="80" y="210" width="30" height="106" fill="#4f46e5"/>
    <rect x="112" y="195" width="22" height="121" fill="#e11d48"/>
    <rect x="136" y="220" width="35" height="96" fill="#059669"/>
    <rect x="173" y="200" width="28" height="116" fill="#ca8a04"/>
  </g>

  <!-- Sağ Kitaplar -->
  <g stroke="#1c1917" stroke-width="2">
    <!-- Raf 1 -->
    <rect x="900" y="70" width="32" height="106" fill="#0284c7"/>
    <rect x="934" y="60" width="24" height="116" fill="#ea580c"/>
    <rect x="960" y="80" width="30" height="96" fill="#16a34a"/>
    <rect x="992" y="75" width="22" height="101" fill="#9333ea"/>
    <rect x="1016" y="65" width="35" height="111" fill="#dc2626"/>
  </g>

  <!-- Arka Plan Tablo / Lamba Işığı -->
  <circle cx="640" cy="200" r="280" fill="url(#warmLamp)"/>
  <rect x="470" y="120" width="340" height="220" rx="8" fill="#1e293b" stroke="#334155" stroke-width="6"/>
  <text x="640" y="210" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" fill="#94a3b8" font-weight="bold">Akademik Kütüphane</text>
  <text x="640" y="245" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" fill="#64748b">isolaTOR Sessiz Çalışma ve Ders Odası</text>
</svg>
