<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <!-- Moon / Ambient orb -->
  <circle cx="640" cy="200" r="180" fill="url(#glow)"/>
  <!-- Mountain layer 1 -->
  <polygon points="-50,550 300,280 650,550" fill="#1e293b"/>
  <polygon points="400,550 780,240 1150,550" fill="#1e293b"/>
  <polygon points="850,550 1100,320 1350,550" fill="#1e293b"/>
  <!-- Mountain layer 2 -->
  <polygon points="100,600 480,360 850,600" fill="#0f172a"/>
  <polygon points="650,600 980,340 1320,600" fill="#0f172a"/>
  <!-- Modern Terrace Foreground -->
  <rect x="0" y="560" width="1280" height="160" fill="#090d16"/>
  <line x1="0" y1="560" x2="1280" y2="560" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Minimalist plant silhouettes -->
  <path d="M150 560 Q 140 460 110 420 Q 150 480 150 560" fill="#10b981" opacity="0.6"/>
  <path d="M150 560 Q 165 440 200 400 Q 165 470 150 560" fill="#10b981" opacity="0.6"/>
  <path d="M1150 560 Q 1140 450 1100 410 Q 1145 470 1150 560" fill="#10b981" opacity="0.6"/>
  <path d="M1150 560 Q 1165 430 1205 390 Q 1165 460 1150 560" fill="#10b981" opacity="0.6"/>
</svg>
