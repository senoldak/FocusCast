<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Duvar ve Şehir Manzaralı Pencere -->
  <rect width="1280" height="720" fill="url(#skyGrad)"/>
  
  <!-- Şehir Silueti (Pencere Arkası) -->
  <rect x="180" y="320" width="90" height="400" fill="#090d16" opacity="0.8"/>
  <rect x="300" y="240" width="120" height="480" fill="#0d1527" opacity="0.9"/>
  <rect x="460" y="290" width="100" height="430" fill="#090d16" opacity="0.7"/>
  <rect x="680" y="220" width="140" height="500" fill="#0d1527" opacity="0.9"/>
  <rect x="850" y="310" width="110" height="410" fill="#090d16" opacity="0.8"/>
  <rect x="1000" y="260" width="130" height="460" fill="#0d1527" opacity="0.85"/>

  <!-- Pencere Çerçeveleri -->
  <rect x="100" y="60" width="1080" height="540" fill="url(#glassGrad)" stroke="#475569" stroke-width="8" rx="10"/>
  <line x1="460" y1="60" x2="460" y2="600" stroke="#475569" stroke-width="8"/>
  <line x1="820" y1="60" x2="820" y2="600" stroke="#475569" stroke-width="8"/>
  <line x1="100" y1="360" x2="1180" y2="360" stroke="#475569" stroke-width="8"/>

  <!-- İç Mekan Bitkisi & Modern Ofis Detayı -->
  <path d="M 120 720 L 170 720 L 160 610 L 130 610 Z" fill="#0f172a"/>
  <ellipse cx="145" cy="560" rx="35" ry="55" fill="#15803d" opacity="0.9"/>
  <ellipse cx="120" cy="540" rx="25" ry="45" fill="#16a34a" opacity="0.8"/>
  <ellipse cx="170" cy="540" rx="25" ry="45" fill="#16a34a" opacity="0.8"/>
</svg>
